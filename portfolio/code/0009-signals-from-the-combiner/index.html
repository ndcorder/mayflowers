<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signals from the Combiner</title>
<style>
  :root {
    --bg: #09090b;
    --surface: #131316;
    --surface-raised: #1a1a1f;
    --text: #ece8e0;
    --text-muted: #5e5e68;
    --accent: #d4915e;
    --accent2: #4e99b5;
    --wave: #4ae0d2;
    --source-a: #c97a3a;
    --source-b: #4a8fbf;
    --grid: #18181f;
    --border: #26262e;
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(74,224,210,0.035) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 85%, rgba(212,145,94,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(30,30,40,0.5) 0%, transparent 80%);
    animation: glowPulse 15s ease-in-out infinite alternate;
  }
  @keyframes glowPulse { 0%{opacity:.8} 100%{opacity:1.2} }
  .container {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem;
  }
  header { margin-bottom: 2rem; }
  h1 {
    font-size: clamp(1.8rem,4vw,2.8rem); font-weight: 200;
    letter-spacing: .15em; text-transform: uppercase; color: var(--text); line-height: 1.1;
  }
  header p {
    font-size: .75rem; color: var(--text-muted);
    letter-spacing: .2em; text-transform: uppercase; margin-top: .4rem;
  }
  .accent-line {
    height: 1px;
    background: linear-gradient(90deg, var(--accent), var(--wave) 50%, var(--accent2));
    margin-top: .75rem; opacity: .5;
  }
  .input-section { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
  @media(max-width:640px){ .input-section{grid-template-columns:1fr} }
  .text-input { display: flex; flex-direction: column; gap: .4rem; }
  .text-input label {
    font-size: .65rem; letter-spacing: .25em; text-transform: uppercase; color: var(--text-muted);
  }
  .text-input textarea {
    width: 100%; height: 120px; padding: .8rem 1rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); font-family: 'Courier New', Courier, monospace;
    font-size: .85rem; line-height: 1.5; resize: vertical;
    transition: border-color .2s, box-shadow .2s; outline: none;
  }
  .text-input textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px rgba(212,145,94,.15);
  }
  .text-input textarea::placeholder { color: #2e2e38; }
  .text-input.a label { color: var(--source-a); }
  .text-input.b label { color: var(--source-b); }
  .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; }
  .btn-generate {
    padding: .65rem 2rem; background: transparent; border: 1px solid var(--accent);
    color: var(--accent); font-family: 'Courier New', Courier, monospace;
    font-size: .75rem; letter-spacing: .2em; text-transform: uppercase;
    cursor: pointer; transition: all .25s; border-radius: 3px;
  }
  .btn-generate:hover {
    background: var(--accent); color: var(--bg);
    box-shadow: 0 0 20px rgba(212,145,94,.2);
  }
  .btn-generate:active { transform: scale(.97); }
  .btn-generate:focus-visible { outline: 2px solid var(--wave); outline-offset: 2px; }
  .btn-generate.generating { opacity: .5; pointer-events: none; }
  .btn-params {
    padding: .65rem 1.5rem; background: transparent; border: 1px solid var(--border);
    color: var(--text-muted); font-family: 'Courier New', Courier, monospace;
    font-size: .7rem; letter-spacing: .15em; text-transform: uppercase;
    cursor: pointer; transition: all .25s; border-radius: 3px;
  }
  .btn-params:hover { border-color: var(--text-muted); color: var(--text); }
  .btn-params:focus-visible { outline: 2px solid var(--wave); outline-offset: 2px; }
  .params-panel {
    display: none; gap: 1.5rem; margin-bottom: 1.5rem; padding: 1rem 1.2rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 4px;
  }
  .params-panel.open { display: flex; flex-wrap: wrap; }
  .param { display: flex; flex-direction: column; gap: .3rem; min-width: 120px; }
  .param label {
    font-size: .6rem; letter-spacing: .2em; text-transform: uppercase; color: var(--text-muted);
  }
  .param input[type="range"] {
    -webkit-appearance: none; appearance: none;
    height: 3px; background: var(--border); border-radius: 2px; outline: none;
  }
  .param input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer;
  }
  .param input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    cursor: pointer; border: none;
  }
  .param-value { font-size: .65rem; color: var(--accent); text-align: right; }
  .seismograph-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden; margin-bottom: 1.5rem;
    opacity: 0; transform: translateY(8px);
    transition: opacity .6s ease, transform .6s ease;
  }
  .seismograph-section.visible { opacity: 1; transform: translateY(0); }
  .seismograph-section svg { display: block; width: 100%; height: auto; }
  .output-section {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 1.5rem;
    opacity: 0; transform: translateY(8px);
    transition: opacity .6s ease .15s, transform .6s ease .15s;
  }
  .output-section.visible { opacity: 1; transform: translateY(0); }
  .output-header {
    font-size: .6rem; letter-spacing: .25em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: .75rem;
  }
  .output-text { font-size: .9rem; line-height: 2; color: var(--text); max-width: 700px; }
  .output-text .sent {
    display: block; margin-bottom: .3rem;
    opacity: 0; animation: fadeSent .5s forwards;
  }
  @keyframes fadeSent { to { opacity: 1; } }
  .output-text .word-a {
    color: var(--source-a); opacity: .7; transition: opacity .2s;
  }
  .output-text .word-a:hover { opacity: 1; }
  .output-text .word-b {
    color: var(--source-b); opacity: .7; transition: opacity .2s;
  }
  .output-text .word-b:hover { opacity: 1; }
  .output-text .word-shared {
    color: var(--wave); opacity: .7; transition: opacity .2s;
  }
  .output-text .word-shared:hover { opacity: 1; }
  .output-text .word-neutral { color: var(--text-muted); transition: opacity .2s; }
  .legend {
    display: flex; gap: 1.5rem; margin-top: 1rem; padding-top: .75rem;
    border-top: 1px solid var(--border); flex-wrap: wrap;
  }
  .legend-item {
    display: flex; align-items: center; gap: .4rem;
    font-size: .6rem; letter-spacing: .15em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .legend-swatch { width: 16px; height: 3px; border-radius: 1px; }
  @media(prefers-reduced-motion:reduce){
    .bg-glow { animation: none; }
    .seismograph-section, .output-section { transition: none; }
    .output-text .sent { animation: none; opacity: 1; }
  }
  footer {
    margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border);
    text-align: center; font-size: .6rem; letter-spacing: .15em;
    text-transform: uppercase; color: #2a2a32;
  }
</style>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="container">
    <header>
      <h1>Signals from the Combiner</h1>
      <p>Text collision seismograph</p>
      <div class="accent-line" aria-hidden="true"></div>
    </header>

    <section class="input-section" aria-label="Source text inputs">
      <div class="text-input a">
        <label for="sourceA">Source Signal A</label>
        <textarea id="sourceA" placeholder="Enter first text..." aria-label="Source text A">The old house groaned in the winter wind, remembering every soul that had walked its darkened halls. Shadows gathered like forgotten promises.</textarea>
      </div>
      <div class="text-input b">
        <label for="sourceB">Source Signal B</label>
        <textarea id="sourceB" placeholder="Enter second text..." aria-label="Source text B">She danced through golden meadows under skies that burned with impossible light, her laughter ringing across the quiet world like bells of hope.</textarea>
      </div>
    </section>

    <div class="controls">
      <button class="btn-generate" id="btnGenerate" aria-label="Generate seismograph">Collide</button>
      <button class="btn-params" id="btnParams" aria-expanded="false" aria-controls="paramsPanel">Parameters</button>
    </div>

    <div class="params-panel" id="paramsPanel" role="group" aria-label="Generation parameters">
      <div class="param">
        <label for="paramSeeds">Seeds</label>
        <input type="range" id="paramSeeds" min="2" max="8" value="4">
        <span class="param-value" id="paramSeedsVal" aria-live="polite">4</span>
      </div>
      <div class="param">
        <label for="paramLength">Max Length</label>
        <input type="range" id="paramLength" min="8" max="35" value="20">
        <span class="param-value" id="paramLengthVal" aria-live="polite">20</span>
      </div>
      <div class="param">
        <label for="paramNoise">Noise</label>
        <input type="range" id="paramNoise" min="0" max="50" value="15">
        <span class="param-value" id="paramNoiseVal" aria-live="polite">15%</span>
      </div>
    </div>

    <div class="seismograph-section" id="seismographSection" role="img" aria-label="Seismograph waveform visualization of combined text emotion">
      <svg id="seismograph" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600"></svg>
    </div>

    <section class="output-section" id="outputSection" aria-label="Combined signal output">
      <div class="output-header">Combined Signal</div>
      <div class="output-text" id="outputText" aria-live="polite"></div>
      <div class="legend" aria-label="Word origin legend">
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--source-a)" aria-hidden="true"></div> From A
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--source-b)" aria-hidden="true"></div> From B
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--wave)" aria-hidden="true"></div> Shared
        </div>
        <div class="legend-item">
          <div class="legend-swatch" style="background:var(--text-muted)" aria-hidden="true"></div> Neutral
        </div>
      </div>
    </section>

    <footer>Markov chain text collision &mdash; emotional valence seismograph</footer>
  </div>

    };

    /* ===== PURE FUNCTIONS ===== */

    /* Break text into lowercase word tokens, stripping punctuation */
    function tokenize(text) {
      return text.toLowerCase().replace(/[^\w\s']/g, ' ').split(/\s+/).filter(function(w) {
        return w.length > 0;
      });
    }

    /* Build a bigram Markov chain: each word maps to an array of its observed successors */
    function buildChain(tokens) {
      var chain = {};
      for (var i = 0; i < tokens.length - 1; i++) {
        var key = tokens[i];
        if (!chain[key]) chain[key] = [];
        chain[key].push(tokens[i + 1]);
      }
      return chain;
    }

    /* Merge two chains by concatenating successor lists for shared keys */
    function mergeChains(c1, c2) {
      var merged = {};
      var k;
      for (k in c1) {
        if (c1.hasOwnProperty(k)) merged[k] = c1[k].slice();
      }
      for (k in c2) {
        if (c2.hasOwnProperty(k)) {
          if (!merged[k]) merged[k] = [];
          merged[k] = merged[k].concat(c2[k]);
        }
      }
      return merged;
    }

    /* Walk the chain from seedWord for up to maxLen steps */
    function generateSentence(chain, seedWord, minLen, maxLen) {
      var words = [seedWord];
      var current = seedWord;
      for (var i = 1; i < maxLen; i++) {
        var nexts = chain[current];
        if (!nexts || nexts.length === 0) break;
        var next = nexts[Math.floor(Math.random() * nexts.length)];
        words.push(next);
        current = next;
        /* After reaching minimum length, probabilistically stop */
        if (i >= minLen - 1 && (Math.random() < 0.25 || !chain[current])) break;
      }
      return words;
    }

    /* Look up a word's emotional valence; unknown words return 0 */
    function getValence(word) {
      var w = word.toLowerCase().replace(/[^a-z']/g, '');
      return LEXICON.hasOwnProperty(w) ? LEXICON[w] : 0;
    }

    /* Classify a word by its source text origin */
    function classifyWord(word, setA, setB) {
      var w = word.toLowerCase().replace(/[^a-z']/g, '');
      var inA = setA.has(w);
      var inB = setB.has(w);
      if (inA && inB) return 'shared';
      if (inA) return 'a';
      if (inB) return 'b';
      return 'neutral';
    }

    /* Fisher-Yates shuffle */
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }

    /* Escape special XML characters */
    function escapeXml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* ===== SVG CONSTANTS ===== */
    var W = 1100, H = 600;
    var MID_Y = H * 0.5;
    var AMP = H * 0.32;
    var PAD_L = 50, PAD_R = 50;

    /* ===== SVG RENDERING ===== */

    /* Convert an array of words into wave points across the x-axis */
    function buildWavePoints(words, startX, endX, noiseFactor) {
      var n = words.length;
      if (n === 0) return [];
      var segW = (endX - startX) / n;
      var pts = [];
      for (var i = 0; i < n; i++) {
        var v = getValence(words[i]);
        var noise = (Math.random() - 0.5) * noiseFactor * AMP * 0.01;
        var y = MID_Y - (v + noise * 0.3) * AMP;
        pts.push({ x: startX + i * segW + segW * 0.5, y: y, valence: v, word: words[i] });
      }
      return pts;
    }

    /* Render an array of points as a smooth cubic bezier SVG path */
    function pointsToSmoothPath(pts, tension) {
      tension = tension || 0.3;
      if (pts.length < 2) {
        return pts.length === 1
          ? 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1)
          : '';
      }
      var d = 'M' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
      for (var i = 0; i < pts.length - 1; i++) {
        var p0 = pts[Math.max(0, i - 1)];
        var p1 = pts[i];
        var p2 = pts[i + 1];
        var p3 = pts[Math.min(pts.length - 1, i + 2)];
        var cp1x = p1.x + (p2.x - p0.x) * tension;
        var cp1y = p1.y + (p2.y - p0.y) * tension;
        var cp2x = p2.x - (p3.x - p1.x) * tension;
        var cp2y = p2.y - (p3.y - p1.y) * tension;
        d += ' C' + cp1x.toFixed(1) + ',' + cp1y.toFixed(1) + ' '
             + cp2x.toFixed(1) + ',' + cp2y.toFixed(1) + ' '
             + p2.x.toFixed(1) + ',' + p2.y.toFixed(1);
      }
      return d;
    }

    /* Render a source text as a layered semi-transparent text block */
    function renderSourceTextLayer(tokens, startX, endX, color) {
      var html = '';
      var maxChars = Math.floor((endX - startX) / 7);
      var text = tokens.join(' ');
      if (text.length > maxChars * 3) text = text.substring(0, maxChars * 3) + '...';
      var words = text.split(' ');
      var lineLen = Math.floor(maxChars / 1.1);
      var lines = [];
      var currentLine = '';
      for (var i = 0; i < words.length; i++) {
        if ((currentLine + ' ' + words[i]).length > lineLen) {
          if (currentLine) lines.push(currentLine);
          currentLine = words[i];
        } else {
          currentLine = currentLine ? currentLine + ' ' + words[i] : words[i];
        }
      }
      if (currentLine) lines.push(currentLine);
      var lineH = 16;
      var totalH = lines.length * lineH;
      var startY = MID_Y - totalH / 2;
      var maxLines = Math.min(lines.length, 18);
      for (var li = 0; li < maxLines; li++) {
        var y = startY + li * lineH;
        html += '<text x="' + startX + '" y="' + y.toFixed(1) + '" fill="' + color
          + '" font-size="11" font-family="\'Courier New\',monospace" opacity="0.6">'
          + escapeXml(lines[li]) + '</text>';
      }
      return html;
    }

    /* Pick a dot color based on valence intensity */
    function valenceColor(v) {
      if (v > 0.3) return '#5aedb8';
      if (v > 0) return '#4ae0d2';
      if (v > -0.3) return '#e0c84a';
      return '#e05a4a';
    }

    /* Build the complete SVG innerHTML for the seismograph */
    function buildSVG(sourceATokens, sourceBTokens, combinedSentences, noiseFactor) {
      var svg = '';
      var contentStart = PAD_L + 10;
      var contentEnd = W - PAD_R - 10;

      /* Background */
      svg += '<rect width="' + W + '" height="' + H + '" fill="#0b0b0e"/>';

      /* Gradient and filter definitions */
      svg += '<defs>';
      svg += '<radialGradient id="vignette" cx="50%" cy="50%" r="60%">'
        + '<stop offset="0%" stop-color="#0b0b0e" stop-opacity="0"/>'
        + '<stop offset="100%" stop-color="#060608" stop-opacity="0.7"/>'
        + '</radialGradient>';
      svg += '<filter id="glowSource" x="-20%" y="-20%" width="140%" height="140%">'
        + '<feGaussianBlur stdDeviation="3" result="blur"/>'
        + '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>'
        + '</filter>';
      svg += '<filter id="glowWave" x="-10%" y="-30%" width="120%" height="160%">'
        + '<feGaussianBlur stdDeviation="4" result="blur"/>'
        + '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>'
        + '</filter>';
      svg += '<filter id="glowStrong" x="-15%" y="-40%" width="130%" height="180%">'
        + '<feGaussianBlur stdDeviation="6" result="blur"/>'
        + '<feComposite in="blur" in2="SourceGraphic" operator="over"/>'
        + '</filter>';
      svg += '</defs>';

      /* Vignette overlay */
      svg += '<rect width="' + W + '" height="' + H + '" fill="url(#vignette)"/>';

      /* Grid lines */
      svg += '<g opacity="0.35">';
      var gridSpacing = 25;
      for (var gy = gridSpacing; gy < H; gy += gridSpacing) {
        svg += '<line x1="' + PAD_L + '" y1="' + gy + '" x2="' + (W - PAD_R)
          + '" y2="' + gy + '" stroke="#18181f" stroke-width="0.5"/>';
      }
      for (var gx = PAD_L; gx <= W - PAD_R; gx += gridSpacing) {
        svg += '<line x1="' + gx + '" y1="20" x2="' + gx + '" y2="' + (H - 20)
          + '" stroke="#18181f" stroke-width="0.5"/>';
      }
      svg += '</g>';

      /* Center baseline with axis labels */
      svg += '<line x1="' + PAD_L + '" y1="' + MID_Y + '" x2="' + (W - PAD_R)
        + '" y2="' + MID_Y + '" stroke="#2e2e38" stroke-width="1" stroke-dasharray="4,6"/>';
      svg += '<text x="' + (PAD_L - 5) + '" y="' + (MID_Y - 5)
        + '" fill="#2e2e38" font-size="8" text-anchor="end" font-family="monospace">0</text>';
      svg += '<text x="' + (PAD_L - 5) + '" y="' + (MID_Y - AMP + 4)
        + '" fill="#2e2e38" font-size="8" text-anchor="end" font-family="monospace">+1</text>';
      svg += '<text x="' + (PAD_L - 5) + '" y="' + (MID_Y + AMP + 4)
        + '" fill="#2e2e38" font-size="8" text-anchor="end" font-family="monospace">-1</text>';

      /* Source A: faded text layer */
      if (sourceATokens.length > 0) {
        svg += '<g opacity="0.12" filter="url(#glowSource)">'
          + renderSourceTextLayer(sourceATokens, contentStart, contentEnd, '#c97a3a')
          + '</g>';
      }

      /* Source B: faded text layer */
      if (sourceBTokens.length > 0) {
        svg += '<g opacity="0.12" filter="url(#glowSource)">'
          + renderSourceTextLayer(sourceBTokens, contentStart, contentEnd, '#4a8fbf')
          + '</g>';
      }

      /* Source A: faint waveform */
      if (sourceATokens.length > 2) {
        var ptsA = buildWavePoints(sourceATokens, contentStart, contentEnd, noiseFactor);
        svg += '<path d="' + pointsToSmoothPath(ptsA, 0.3)
          + '" fill="none" stroke="#c97a3a" stroke-width="1" opacity="0.15" filter="url(#glowSource)"/>';
      }

      /* Source B: faint waveform */
      if (sourceBTokens.length > 2) {
        var ptsB = buildWavePoints(sourceBTokens, contentStart, contentEnd, noiseFactor);
        svg += '<path d="' + pointsToSmoothPath(ptsB, 0.3)
          + '" fill="none" stroke="#4a8fbf" stroke-width="1" opacity="0.15" filter="url(#glowSource)"/>';
      }

      /* Flatten combined sentences into a single word array */
      var allCombined = [];
      for (var si = 0; si < combinedSentences.length; si++) {
        for (var wi = 0; wi < combinedSentences[si].length; wi++) {
          allCombined.push(combinedSentences[si][wi]);
        }
      }

      /* Main combined waveform */
      if (allCombined.length > 1) {
        var mainPts = buildWavePoints(allCombined, contentStart, contentEnd, noiseFactor);
        var mainPath = pointsToSmoothPath(mainPts, 0.25);

        /* Translucent area fill beneath the wave */
        var areaPath = mainPath
          + ' L' + mainPts[mainPts.length - 1].x.toFixed(1) + ',' + MID_Y
          + ' L' + mainPts[0].x.toFixed(1) + ',' + MID_Y + ' Z';
        svg += '<path d="' + areaPath + '" fill="#4ae0d2" opacity="0.04"/>';

        /* Sharp wave line with glow */
        svg += '<path d="' + mainPath
          + '" fill="none" stroke="#4ae0d2" stroke-width="2.5" opacity="0.9" filter="url(#glowWave)"/>';
        svg += '<path d="' + mainPath
          + '" fill="none" stroke="#4ae0d2" stroke-width="5" opacity="0.15" filter="url(#glowStrong)"/>';

        /* Word-position dots sized and colored by valence */
        for (var di = 0; di < mainPts.length; di++) {
          var pt = mainPts[di];
          var dotColor = valenceColor(pt.valence);
          var r = Math.max(2.5, 2.5 + Math.abs(pt.valence) * 3);
          svg += '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1)
            + '" r="' + r.toFixed(1) + '" fill="' + dotColor + '" opacity="0.7"/>';
          svg += '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1)
            + '" r="' + (r + 2).toFixed(1) + '" fill="' + dotColor + '" opacity="0.15"/>';
        }

        /* Word labels along the bottom, evenly sampled to avoid overlap */
        var labelY = H - 18;
        var maxLabels = Math.min(mainPts.length, 30);
        var labelStep = Math.max(1, Math.floor(mainPts.length / maxLabels));
        for (var li = 0; li < mainPts.length; li += labelStep) {
          var lpt = mainPts[li];
          if (lpt.word.length > 10) continue;
          var lColor = valenceColor(lpt.valence);
          svg += '<text x="' + lpt.x.toFixed(1) + '" y="' + labelY
            + '" fill="' + lColor
            + '" font-size="7" text-anchor="middle" font-family="\'Courier New\',monospace" opacity="0.5">'
            + escapeXml(lpt.word) + '</text>';
        }
      }

      /* Frame tick marks */
      for (var fx = PAD_L; fx <= W - PAD_R; fx += 50) {
        svg += '<line x1="' + fx + '" y1="15" x2="' + fx
          + '" y2="22" stroke="#2e2e38" stroke-width="0.5"/>';
        svg += '<line x1="' + fx + '" y1="' + (H - 22) + '" x2="' + fx
          + '" y2="' + (H - 15) + '" stroke="#2e2e38" stroke-width="0.5"/>';
      }

      /* Top header label */
      svg += '<text x="' + (W / 2) + '" y="12" fill="#2e2e38" font-size="8" text-anchor="middle" font-family="monospace" letter-spacing="3">SIGNAL COMBINER OUTPUT</text>';

      return svg;
    }

    /* ===== DOM INTERACTION ===== */

    /* Build one sentence-span's inner HTML with color-coded word classes */
    function buildSentenceHTML(words, setA, setB) {
      var parts = [];
      for (var i = 0; i < words.length; i++) {
        var cls = classifyWord(words[i], setA, setB);
        parts.push('<span class="word-' + cls + '">' + escapeXml(words[i]) + '</span>');
      }
      return parts.join(' ');
    }

    /* Main generation routine */
    function generate() {
      var textA = document.getElementById('sourceA').value.trim();
      var textB = document.getElementById('sourceB').value.trim();

      if (!textA || !textB) {
        showToast('Both source texts are required.');
        return;
      }

      var numSeeds = parseInt(document.getElementById('paramSeeds').value, 10);
      var maxLen = parseInt(document.getElementById('paramLength').value, 10);
      var noiseFactor = parseInt(document.getElementById('paramNoise').value, 10);

      var tokensA = tokenize(textA);
      var tokensB = tokenize(textB);

      if (tokensA.length < 3 || tokensB.length < 3) {
        showToast('Each text needs at least 3 words.');
        return;
      }

      var setA = new Set(tokensA);
      var setB = new Set(tokensB);

      var chainA = buildChain(tokensA);
      var chainB = buildChain(tokensB);
      var merged = mergeChains(chainA, chainB);

      var allKeys = Object.keys(merged);
      var intersection = [], onlyA = [], onlyB = [];
      for (var ki = 0; ki < allKeys.length; ki++) {
        var k = allKeys[ki];
        if (setA.has(k) && setB.has(k)) intersection.push(k);
        else if (setA.has(k)) onlyA.push(k);
        else if (setB.has(k)) onlyB.push(k);
      }

      shuffle(intersection);
      shuffle(onlyA);
      shuffle(onlyB);

      /* Prefer intersection seeds, then unique-to-each-source, then any */
      var pool = intersection.concat(onlyA).concat(onlyB).concat(allKeys);
      var seeds = [];
      for (var pi = 0; seeds.length < numSeeds && pi < pool.length; pi++) {
        if (seeds.indexOf(pool[pi]) === -1) seeds.push(pool[pi]);
      }

      var minLen = Math.max(5, Math.floor(maxLen * 0.4));
      var sentences = [];
      for (var si = 0; si < seeds.length; si++) {
        var s = generateSentence(merged, seeds[si], minLen, maxLen);
        if (s.length >= 3) sentences.push(s);
      }

      if (sentences.length === 0) {
        showToast('Could not generate output. Try longer or more varied texts.');
        return;
      }

      /* Render seismograph SVG */
      var svgEl = document.getElementById('seismograph');
      svgEl.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      svgEl.innerHTML = buildSVG(tokensA, tokensB, sentences, noiseFactor);
      document.getElementById('seismographSection').classList.add('visible');

      /* Render output text with proper capitalization */
      var container = document.getElementById('outputText');
      container.innerHTML = '';
      for (var idx = 0; idx < sentences.length; idx++) {
        var sent = sentences[idx];
        var span = document.createElement('span');
        span.className = 'sent';
        span.style.animationDelay = (idx * 0.12) + 's';

        /* Capitalize the first word's text, not the HTML tag */
        var html = buildSentenceHTML(sent, setA, setB);
        if (sent.length > 0) {
          /* Replace the first word's text content with a capitalized version */
          var firstWord = sent[0];
          var capped = firstWord.charAt(0).toUpperCase() + firstWord.slice(1);
          var firstCls = classifyWord(firstWord, setA, setB);
          var firstTag = '<span class="word-' + firstCls + '">' + escapeXml(firstWord) + '</span>';
          var cappedTag = '<span class="word-' + firstCls + '">' + escapeXml(capped) + '</span>';
          html = html.replace(firstTag, cappedTag);
        }
        html += '.';

        span.innerHTML = html;
        container.appendChild(span);
      }
      document.getElementById('outputSection').classList.add('visible');
    }

    /* Lightweight inline toast notification */
    function showToast(msg) {
      var toast = document.getElementById('toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'toast';
        toast.setAttribute('role', 'alert');
        toast.style.cssText = 'position:fixed;bottom:2rem;left:50%;transform:translateX(-50%);'
          + 'background:#1a1a1f;border:1px solid #d4915e;color:#ece8e0;padding:0.7rem 1.4rem;'
          + 'font-family:monospace;font-size:0.75rem;border-radius:4px;z-index:999;'
          + 'opacity:0;transition:opacity 0.3s;pointer-events:none;letter-spacing:0.1em;';
        document.body.appendChild(toast);
      }
      toast.textContent = msg;
      toast.style.opacity = '1';
      clearTimeout(toast._timer);
      toast._timer = setTimeout(function() { toast.style.opacity = '0'; }, 2500);
    }

    /* ===== EVENT BINDINGS ===== */

    document.getElementById('btnGenerate').addEventListener('click', function() {
      var btn = this;
      btn.classList.add('generating');
      setTimeout(function() {
        generate();
        btn.classList.remove('generating');
      }, 80);
    });

    document.getElementById('btnParams').addEventListener('click', function() {
      var panel = document.getElementById('paramsPanel');
      var isOpen = panel.classList.toggle('open');
      this.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    document.getElementById('paramSeeds').addEventListener('input', function() {
      document.getElementById('paramSeedsVal').textContent = this.value;
    });
    document.getElementById('paramLength').addEventListener('input', function() {
      document.getElementById('paramLengthVal').textContent = this.value;
    });
    document.getElementById('paramNoise').addEventListener('input', function() {
      document.getElementById('paramNoiseVal').textContent = this.value + '%';
    });

    /* Keyboard shortcut: Ctrl/Cmd + Enter to generate */
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('btnGenerate').click();
      }
    });

  })();
  </script>
</body>
</html>
