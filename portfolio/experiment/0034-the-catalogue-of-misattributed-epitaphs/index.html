<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Catalogue of Misattributed Epitaphs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0A0A08;
  --surface: #141412;
  --card: #1A1A17;
  --card-hover: #222220;
  --border: #2A2A26;
  --border-light: #3A3A35;
  --text: #C4BFA8;
  --text-bright: #E8E4D0;
  --text-dim: #706D5C;
  --accent: #8B7B58;
  --accent-bright: #B5A478;
  --accent-dim: #5C5038;
  --blood: #7A2838;
  --blood-glow: #A8384A;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono: 'DM Mono', 'Consolas', monospace;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
  font-family: var(--serif);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  overflow-x: hidden;
}

::selection { background: var(--accent-dim); color: var(--text-bright); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Header ── */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10, 10, 8, 0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
}

.header-inner {
  max-width: 1400px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 64px;
  gap: 1rem;
}

.header-title {
  font-size: 1.05rem;
  font-weight: 400;
  letter-spacing: 0.05em;
  color: var(--text-bright);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}

.header-title span {
  color: var(--accent);
  font-style: italic;
}

.header-controls {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-shrink: 0;
  flex-wrap: wrap;
}

.search-box { position: relative; }

.search-box i {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 0.7rem;
  pointer-events: none;
}

.search-box input {
  font-family: var(--mono);
  font-size: 0.72rem;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.4rem 0.7rem 0.4rem 1.9rem;
  border-radius: 4px;
  width: 200px;
  transition: border-color 0.3s;
}

.search-box input::placeholder { color: var(--text-dim); }
.search-box input:focus { outline: none; border-color: var(--accent); }

.filter-btn {
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 0.4rem 0.7rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

.filter-btn:hover,
.filter-btn.active {
  border-color: var(--accent);
  color: var(--accent-bright);
  background: rgba(139, 123, 88, 0.08);
}

.filter-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.count-badge {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--text-dim);
  padding: 0.4rem 0.55rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  white-space: nowrap;
}

/* ── Filter Drawer ── */

.filter-drawer {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
  background: var(--surface);
}

.filter-drawer.open {
  max-height: 300px;
  border-bottom: 1px solid var(--border);
}

.filter-inner {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1rem 2rem;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 0.75rem;
}

.filter-group label {
  display: block;
  font-family: var(--mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 0.25rem;
}

.filter-group select {
  width: 100%;
  font-family: var(--mono);
  font-size: 0.72rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.35rem 0.5rem;
  border-radius: 3px;
  cursor: pointer;
}

.filter-group select:focus { outline: none; border-color: var(--accent); }

/* ── Main Grid ── */

main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 1.5rem 2rem 4rem;
}

.results-info {
  font-family: var(--mono);
  font-size: 0.68rem;
  color: var(--text-dim);
  margin-bottom: 1rem;
  letter-spacing: 0.04em;
}

.results-info span { color: var(--accent); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1rem;
}

/* ── Card ── */

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.2rem 1.2rem 0.9rem;
  cursor: pointer;
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.card::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(139, 123, 88, 0.04), transparent 60%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.card:hover {
  background: var(--card-hover);
  border-color: var(--border-light);
  transform: translateY(-1px);
}

.card:hover::after { opacity: 1; }

.card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.card-number {
  font-family: var(--mono);
  font-size: 0.52rem;
  color: var(--text-dim);
  letter-spacing: 0.1em;
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  opacity: 0.6;
}

.card-era {
  font-family: var(--mono);
  font-size: 0.56rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--accent);
  margin-bottom: 0.5rem;
  padding-right: 3.5rem;
}

.card-inscription {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 400;
  font-style: italic;
  line-height: 1.65;
  color: var(--text-bright);
  margin-bottom: 0.7rem;
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
}

.card-tag {
  font-family: var(--mono);
  font-size: 0.5rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: rgba(255, 255, 255, 0.02);
  padding: 0.15rem 0.4rem;
  border-radius: 2px;
  border: 1px solid rgba(255, 255, 255, 0.03);
}

/* ── Modal ── */

.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: none;
  overflow-y: auto;
  padding: 2rem;
}

.modal-overlay.active { display: block; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 100%;
  max-width: 780px;
  position: relative;
  margin: 0 auto;
  animation: modalIn 0.25s ease;
}

@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-close {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  background: none;
  border: 1px solid transparent;
  color: var(--text-dim);
  font-size: 1rem;
  cursor: pointer;
  z-index: 10;
  transition: all 0.2s;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 4px;
}

.modal-close:hover {
  color: var(--text-bright);
  background: rgba(255, 255, 255, 0.05);
  border-color: var(--border);
}

.modal-close:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.modal-body { padding: 2rem 2.25rem 2.25rem; }

.modal-era {
  font-family: var(--mono);
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--accent);
  margin-bottom: 0.3rem;
}

.modal-id {
  font-family: var(--mono);
  font-size: 0.52rem;
  color: var(--text-dim);
  margin-bottom: 1.5rem;
  letter-spacing: 0.04em;
}

.modal-inscription {
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 300;
  font-style: italic;
  line-height: 1.75;
  color: var(--text-bright);
  margin-bottom: 1.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}

.modal-meta {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.45rem 2rem;
  margin-bottom: 2rem;
}

.meta-item {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
}

.meta-label {
  font-family: var(--mono);
  font-size: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-dim);
}

.meta-value {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--text);
}

/* ── Scholarship ── */

.scholarship-section { margin-bottom: 2rem; }

.section-label {
  font-family: var(--mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--accent-dim);
  margin-bottom: 0.9rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
}

.interp {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-dim);
  border-radius: 4px;
  padding: 0.9rem 1.1rem;
  margin-bottom: 0.6rem;
}

.interp-camp {
  font-family: var(--serif);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--accent-bright);
  margin-bottom: 0.25rem;
}

.interp-text {
  font-size: 0.82rem;
  color: var(--text);
  line-height: 1.6;
}

/* ── Truth Section ── */

.truth-section {
  border: 1px solid var(--blood);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

.truth-section::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(122, 40, 56, 0.05), transparent);
  pointer-events: none;
  z-index: 0;
}

.truth-header {
  padding: 0.9rem 1.15rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(122, 40, 56, 0.2);
  gap: 1rem;
  position: relative;
  z-index: 1;
}

.truth-header-left {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.truth-status {
  font-family: var(--mono);
  font-size: 0.58rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--blood);
}

.truth-effort {
  font-family: var(--mono);
  font-size: 0.6rem;
  color: var(--text-dim);
}

.truth-effort span {
  color: var(--blood-glow);
  font-weight: 500;
}

.reveal-btn {
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: rgba(122, 40, 56, 0.12);
  border: 1px solid rgba(122, 40, 56, 0.35);
  color: var(--blood-glow);
  padding: 0.5rem 1.15rem;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.3s;
  white-space: nowrap;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}

.reveal-btn:hover:not(:disabled) {
  background: rgba(122, 40, 56, 0.22);
  border-color: var(--blood-glow);
}

.reveal-btn:focus-visible {
  outline: 2px solid var(--blood-glow);
  outline-offset: 2px;
}

.reveal-btn:disabled { cursor: default; opacity: 1; }

.reveal-btn.revealed {
  background: rgba(122, 40, 56, 0.2);
  border-color: rgba(122, 40, 56, 0.5);
}

.truth-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.6s ease;
  position: relative;
  z-index: 1;
}

.truth-content.revealed { max-height: 500px; }

.truth-text {
  padding: 1.15rem;
  font-size: 0.88rem;
  color: var(--text-bright);
  line-height: 1.7;
  border-top: 1px solid rgba(122, 40, 56, 0.15);
}

/* ── Progress ── */

.progress-section {
  margin-top: 1.75rem;
  padding-top: 1.25rem;
  border-top: 1px solid var(--border);
}

.progress-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.4rem;
}

.progress-header span {
  font-family: var(--mono);
  font-size: 0.56rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
}

.progress-bar-outer {
  width: 100%;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.progress-bar-inner {
  height: 100%;
  background: var(--blood);
  border-radius: 2px;
  transition: width 0.5s ease;
  min-width: 0;
}

/* ── Empty State ── */

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-dim);
}

.empty-state i {
  font-size: 1.8rem;
  margin-bottom: 0.75rem;
  display: block;
  opacity: 0.25;
}

.empty-state p {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.04em;
}

/* ── Responsive ── */

@media (max-width: 768px) {
  header { padding: 0 1rem; }

  .header-inner {
    flex-wrap: wrap;
    height: auto;
    padding: 0.65rem 0;
    gap: 0.4rem;
  }

  .header-title { font-size: 0.85rem; width: 100%; }
  .search-box input { width: 130px; }
  .filter-inner { padding: 0.75rem 1rem; grid-template-columns: 1fr 1fr; }
  main { padding: 1rem; }
  .grid { grid-template-columns: 1fr; }
  .modal-body { padding: 1.5rem 1.25rem; }
  .modal-inscription { font-size: 1.1rem; }
  .modal-meta { grid-template-columns: 1fr; }
  .truth-header { flex-direction: column; align-items: flex-start; gap: 0.6rem; }
  .reveal-btn { width: 100%; text-align: center; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
  .card:hover { transform: none; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-title">The Catalogue of <span>Misattributed</span> Epitaphs</div>
    <div class="header-controls">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search inscriptions..." aria-label="Search inscriptions">
      </div>
      <button class="filter-btn" id="filterToggle"><i class="fas fa-sliders-h"></i> Filters</button>
      <div class="count-badge" id="countBadge">45 entries</div>
    </div>
  </div>
  <div class="filter-drawer" id="filterDrawer">
    <div class="filter-inner">
      <div class="filter-group">
        <label for="filterEra">Era</label>
        <select id="filterEra"><option value="">All Eras</option></select>
      </div>
      <div class="filter-group">
        <label for="filterRegion">Region</label>
        <select id="filterRegion"><option value="">All Regions</option></select>
      </div>
      <div class="filter-group">
        <label for="filterMaterial">Material</label>
        <select id="filterMaterial"><option value="">All Materials</option></select>
      </div>
      <div class="filter-group">
        <label for="filterFaith">Presumed Faith</label>
        <select id="filterFaith"><option value="">All Faiths</option></select>
      </div>
      <div class="filter-group">
        <label for="filterTone">Hidden Tone</label>
        <select id="filterTone"><option value="">All Tones</option></select>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="results-info" id="resultsInfo"></div>
  <div class="grid" id="grid"></div>
</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose" aria-label="Close"><i class="fas fa-times"></i></button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  DATA — 45 epitaphs, each carrying a lie inscribed and a truth
//  buried. Scholarship argues over the inscription. The truth
//  waits beneath a surface you must choose to break.
// ═══════════════════════════════════════════════════════════════

const epitaphs = [
  {
    id: 1,
    year: "~312 CE",
    era: "Roman Imperial",
    region: "Britannia Superior",
    material: "Limestone",
    faith: "Mithraic",
    language: "Latin",
    inscription: "Here lies Marcus. He found what he sought. Fortuna keep his secret.",
    scholars: [
      { camp: "The Gnostic School", text: "The phrase 'what he sought' indicates attainment of esoteric knowledge\u2014perhaps the Mithraic initiation's seventh grade. Marcus achieved the metaphysical and wanted it concealed from the uninitiated." },
      { camp: "The Equestrian Reading", text: "A retired cavalry officer's epitaph. 'What he sought' is purely domestic\u2014a plot of land, a quiet retirement. 'Fortuna keep his secret' is nothing more than a wife's gentle wish for privacy." },
      { camp: "The Fatalist Camp", text: "Marcus sought death itself. The inscription is a suicide's confession, veiled in acceptable language. 'Fortuna keep his secret' is a plea for the manner of his end to remain unknown." }
    ],
    truth: "Marcus did find what he sought: he went looking for his neighbor's wife in a shrine of Mithras. The collapse that killed him was triggered by his own hands removing a load-bearing stone to hide inside. Fortuna kept no one's secret. His bones were found with hers.",
    tone: "farce"
  },
  {
    id: 2,
    year: "~47 CE",
    era: "Roman Imperial",
    region: "Moesia",
    material: "Marble",
    faith: "Thracian indigenous",
    language: "Thracian (Latin transliteration)",
    inscription: "For Venna. She made the sun come home. Her hair was the color of good mud.",
    scholars: [
      { camp: "The Solar Cultists", text: "A priestess of a Thracian solar deity. 'Made the sun come home' is ritual language for the winter solstice ceremony\u2014her death ensured the sun's return. The 'good mud' is sacred earth." },
      { camp: "The Domestic Reading", text: "Purely affectionate. She opened the curtains each morning\u2014literally making the sun 'come home.' Her hair was brown. Her husband's grief was entire and unmysterious." },
      { camp: "The Poetic Opposition", text: "A deliberate juxtaposition: the cosmic (sun coming home) against the absurdly mundane (hair like mud). This is a Thracian literary form\u2014a humility-genre epitaph meant to deflate grandeur." }
    ],
    truth: "Venna kept carrier pigeons. Every evening she released them from the tower, and they returned by sunset. The village called it 'making the sun come home' because you could set your watch by the birds. Her husband, who wrote the inscription, had always thought her hair looked like the riverbank where they met. He was not a poet. He just loved her.",
    tone: "mundane"
  },
  {
    id: 3,
    year: "~102 CE",
    era: "Roman Imperial",
    region: "Aegyptus",
    material: "Basalt",
    faith: "Isiac",
    language: "Coptic",
    inscription: "I, Thentnopis, go to meet the Great Mother. My husband waits with the ibis. Do not weep; I have already arrived.",
    scholars: [
      { camp: "The Mystagogues", text: "A high initiate of the Isis cult approaching death with perfect serenity. 'Already arrived' is mystical language\u2014she experienced union with the goddess while living, making biological death irrelevant." },
      { camp: "The Widowhood School", text: "Thentnopis's husband predeceased her. The ibis is his gravesite marker. She is joining him in death; the serenity is genuine. The inscription documents a woman's peaceful anticipation of reunion." },
      { camp: "The Fraud Theory", text: "The inscription was commissioned by the temple priesthood after appropriating her estate. The 'I have already arrived' is administrative\u2014a retroactive dating of her property transfer." }
    ],
    truth: "Thentnopis fled. She left her husband, her name, and her village in a single night, taking only a small ibis carving he had given her. The family, unable to explain the disappearance, purchased a stone and composed an epitaph no one could contradict. Thentnopis was last seen by a grain merchant two hundred miles south, alive and unnamed.",
    tone: "freedom"
  },
  {
    id: 4,
    year: "~267 CE",
    era: "Roman Imperial",
    region: "Numidia",
    material: "Sandstone",
    faith: "Christian",
    language: "Latin (Punic substrate)",
    inscription: "Rebecca slept before waking. She asks you to love one another.",
    scholars: [

    tone: "sweetness"
  },
  {
    id: 45,
    year: "~1959 CE",
    era: "Modern",
    region: "Uppsala",
    material: "Granite",
    faith: "Church of Sweden (Lutheran)",
    language: "Swedish",
    inscription: "Brita. She counted every snowfall. She stopped at sixty-seven.",
    scholars: [
      { camp: "The Scientific School", text: "Brita was an amateur meteorologist who kept precise records of annual snowfall in Uppsala for sixty-seven years. 'Stopped at sixty-seven' means she died at that age. The inscription documents a life's work." },
      { camp: "The Seasonal Symbolists", text: "Each snowfall is a year. Brita 'counted' her years\u2014she was aware of time passing. 'Stopped at sixty-seven' is simply the total. The inscription is a poetic compression of a lifespan." },
      { camp: "The Dementia Reading", text: "Brita had dementia in her later years and counted snowfalls obsessively\u2014a repetitive behavior associated with cognitive decline. The family reframed this as a charming eccentricity in the epitaph." }
    ],
    truth: "Brita did count every snowfall. She wrote the date of each first snow on the back of a kitchen door in pencil. Sixty-seven winters of first snows, recorded in a small, steady hand. Her daughter found the door after the funeral and, unable to bring herself to erase it, had it removed from its hinges and placed in the attic. The last entry, in a hand that trembled, read: 'First snow. I am ready.' She was not counting. She was waiting.",
    tone: "love"
  }
];

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════

const revealedIds = new Set();

// ═══════════════════════════════════════════════════════════════
//  DIFFICULTY — truth resists discovery; the interface
//  becomes progressively hostile
// ═══════════════════════════════════════════════════════════════

function getDifficulty(id) {
  if (id <= 10) return 1;
  if (id <= 20) return 2;
  if (id <= 30) return 3;
  if (id <= 40) return 4;
  return 5;
}

const DIFFICULTY_LABELS = [
  '',
  'Trace evidence',
  'Minor excavation',
  'Careful extraction',
  'Major excavation',
  'Core sample'
];

const HOLD_TIMES = [500, 1200, 2500, 4000, 6000];

// ═══════════════════════════════════════════════════════════════
//  FILTERS
// ═══════════════════════════════════════════════════════════════

function populateFilters() {
  const eras = new Set();
  const regions = new Set();
  const materials = new Set();
  const faiths = new Set();
  const tones = new Set();

  epitaphs.forEach(e => {
    eras.add(e.era);
    regions.add(e.region);
    materials.add(e.material);
    faiths.add(e.faith);
    tones.add(e.tone);
  });

  const fill = (sel, set) => {
    [...set].sort().forEach(v => {
      const opt = document.createElement('option');
      opt.value = v;
      opt.textContent = v;
      sel.appendChild(opt);
    });
  };

  fill(document.getElementById('filterEra'), eras);
  fill(document.getElementById('filterRegion'), regions);
  fill(document.getElementById('filterMaterial'), materials);
  fill(document.getElementById('filterFaith'), faiths);
  fill(document.getElementById('filterTone'), tones);
}

function getFilteredEpitaphs() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  const era = document.getElementById('filterEra').value;
  const region = document.getElementById('filterRegion').value;
  const material = document.getElementById('filterMaterial').value;
  const faith = document.getElementById('filterFaith').value;
  const tone = document.getElementById('filterTone').value;

  return epitaphs.filter(e => {
    // Full-text search across all visible fields
    if (query) {
      const fields = [
        e.inscription, e.truth, e.region, e.material,
        e.faith, e.language, e.era, e.tone
      ];
      const scholarText = e.scholars.map(s => s.camp + ' ' + s.text).join(' ');
      const haystack = (fields.join(' ') + ' ' + scholarText).toLowerCase();
      if (!haystack.includes(query)) return false;
    }
    if (era && e.era !== era) return false;
    if (region && e.region !== region) return false;
    if (material && e.material !== material) return false;
    if (faith && e.faith !== faith) return false;
    if (tone && e.tone !== tone) return false;
    return true;
  });
}

// ═══════════════════════════════════════════════════════════════
//  GRID RENDERING
// ═══════════════════════════════════════════════════════════════

function renderGrid() {
  const filtered = getFilteredEpitaphs();
  const grid = document.getElementById('grid');
  const info = document.getElementById('resultsInfo');

  info.innerHTML = `Showing <span>${filtered.length}</span> of ${epitaphs.length} catalogue entries`;
  document.getElementById('countBadge').textContent = `${filtered.length} entries`;

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-monument"></i>
        <p>No inscriptions match your query. The archive remains silent.</p>
      </div>`;
    return;
  }

  grid.innerHTML = filtered.map(e => {
    const num = String(e.id).padStart(3, '0');
    return `
      <div class="card" data-id="${e.id}" tabindex="0" role="button" aria-label="View epitaph ${e.id}">
        <div class="card-number">No. ${num}</div>
        <div class="card-era">${e.era}</div>
        <div class="card-inscription">${e.inscription}</div>
        <div class="card-tags">
          <span class="card-tag">${e.region}</span>
          <span class="card-tag">${e.material}</span>
          <span class="card-tag">${e.year}</span>
        </div>
      </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════════════

function showModal(id) {
  const e = epitaphs.find(x => x.id === id);
  if (!e) return;

  const diff = getDifficulty(e.id);
  const isRevealed = revealedIds.has(e.id);
  const holdTime = HOLD_TIMES[diff - 1];
  const num = String(e.id).padStart(3, '0');

  const scholarsHtml = e.scholars.map(s => `
    <div class="interp">
      <div class="interp-camp">${s.camp}</div>
      <div class="interp-text">${s.text}</div>
    </div>
  `).join('');

  document.getElementById('modalBody').innerHTML = `
    <div class="modal-era">${e.era}</div>
    <div class="modal-id">Catalogue No. ${num} \u2014 ${e.year}</div>
    <div class="modal-inscription">${e.inscription}</div>
    <div class="modal-meta">
      <div class="meta-item"><span class="meta-label">Region</span><span class="meta-value">${e.region}</span></div>
      <div class="meta-item"><span class="meta-label">Material</span><span class="meta-value">${e.material}</span></div>
      <div class="meta-item"><span class="meta-label">Presumed Faith</span><span class="meta-value">${e.faith}</span></div>
      <div class="meta-item"><span class="meta-label">Language</span><span class="meta-value">${e.language}</span></div>
    </div>
    <div class="scholarship-section">
      <div class="section-label">Scholarly Interpretations</div>
      ${scholarsHtml}
    </div>
    <div class="truth-section" id="truthSection">
      <div class="truth-header">
        <div class="truth-header-left">
          <div class="truth-status" id="truthStatus">${isRevealed ? 'RECOVERED' : 'CONCEALED'}</div>
          <div class="truth-effort">Required effort: <span>${DIFFICULTY_LABELS[diff]}</span></div>
        </div>
        <button class="reveal-btn${isRevealed ? ' revealed' : ''}" id="revealBtn"
          data-id="${e.id}" data-hold="${holdTime}"
          ${isRevealed ? 'disabled' : ''}>
          ${isRevealed ? 'Recovered' : 'Hold to excavate'}
        </button>
      </div>
      <div class="truth-content${isRevealed ? ' revealed' : ''}" id="truthContent">
        <div class="truth-text">${isRevealed ? e.truth : ''}</div>
      </div>
    </div>
    <div class="progress-section">
      <div class="progress-header">
        <span>Catalogue excavation</span>
        <span id="progressCount">${revealedIds.size} / ${epitaphs.length} truths recovered</span>
      </div>
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" id="progressBar" style="width:${(revealedIds.size / epitaphs.length * 100).toFixed(1)}%"></div>
      </div>
    </div>
  `;

  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  bindRevealButton();
  document.getElementById('modal').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function hideModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

// ═══════════════════════════════════════════════════════════════
//  REVEAL MECHANIC — hold to excavate; truth resists
// ═══════════════════════════════════════════════════════════════

function bindRevealButton() {
  const btn = document.getElementById('revealBtn');
  if (!btn || btn.disabled) return;

  const id = parseInt(btn.dataset.id, 10);
  const holdTime = parseInt(btn.dataset.hold, 10);
  let holdStart = 0;
  let timer = null;
  let completed = false;

  function startHold(ev) {
    if (completed) return;
    ev.preventDefault();
    holdStart = Date.now();
    btn.style.opacity = '0.85';

    timer = setInterval(() => {
      const elapsed = Date.now() - holdStart;
      const pct = Math.min(elapsed / holdTime * 100, 100);
      btn.style.background = `linear-gradient(90deg, rgba(122,40,56,0.35) ${pct}%, rgba(122,40,56,0.12) ${pct}%)`;

      if (pct >= 100) {
        clearInterval(timer);
        timer = null;
        completed = true;
        completeReveal(id);
      }
    }, 25);
  }

  function endHold() {
    if (completed) return;
    clearInterval(timer);
    timer = null;
    btn.style.opacity = '';
    btn.style.background = '';
  }

  btn.addEventListener('mousedown', startHold);
  btn.addEventListener('mouseup', endHold);
  btn.addEventListener('mouseleave', endHold);
  btn.addEventListener('touchstart', startHold, { passive: false });
  btn.addEventListener('touchend', endHold);
  btn.addEventListener('touchcancel', endHold);
}

function completeReveal(id) {
  const epitaph = epitaphs.find(x => x.id === id);
  if (!epitaph || revealedIds.has(id)) return;

  revealedIds.add(id);

  const btn = document.getElementById('revealBtn');
  const content = document.getElementById('truthContent');
  const status = document.getElementById('truthStatus');

  if (btn) {
    btn.textContent = 'Recovered';
    btn.disabled = true;
    btn.style.opacity = '';
    btn.style.background = 'rgba(122,40,56,0.22)';
  }

  if (status) status.textContent = 'RECOVERED';

  const textEl = content ? content.querySelector('.truth-text') : null;
  if (textEl) textEl.textContent = epitaph.truth;
  if (content) content.classList.add('revealed');

  const bar = document.getElementById('progressBar');
  if (bar) bar.style.width = `${(revealedIds.size / epitaphs.length * 100).toFixed(1)}%`;

  const count = document.getElementById('progressCount');
  if (count) count.textContent = `${revealedIds.size} / ${epitaphs.length} truths recovered`;
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════

function init() {
  populateFilters();
  renderGrid();

  // Debounced search
  let searchTimer = null;
  document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderGrid, 150);
  });

  // Filter dropdowns
  ['filterEra', 'filterRegion', 'filterMaterial', 'filterFaith', 'filterTone'].forEach(id => {
    document.getElementById(id).addEventListener('change', renderGrid);
  });

  // Filter drawer toggle
  document.getElementById('filterToggle').addEventListener('click', () => {
    document.getElementById('filterDrawer').classList.toggle('open');
    document.getElementById('filterToggle').classList.toggle('active');
  });

  // Card click / keyboard
  document.getElementById('grid').addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (card) showModal(parseInt(card.dataset.id, 10));
  });

  document.getElementById('grid').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const card = e.target.closest('.card');
      if (card) showModal(parseInt(card.dataset.id, 10));
    }
  });

  // Modal close
  document.getElementById('modalClose').addEventListener('click', hideModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) hideModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') hideModal();
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
