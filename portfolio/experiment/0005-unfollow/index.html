<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unfollow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <div id="instructions" role="dialog" aria-label="Instructions">
      <div class="instruction-inner">
        <p class="instruction-line">Write to someone you've lost.</p>
        <p class="instruction-line instruction-sub">Not to death. To time, to choice, to silence.</p>
        <p class="instruction-line instruction-cta">Click anywhere to begin.</p>
      </div>
    </div>

    <main id="surface">
      <div id="writing-area" aria-label="Writing area">
        <span id="text-body"></span><span id="cursor" aria-hidden="true"></span>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
